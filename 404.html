<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — BRAIN</title>
<meta name="robots" content="noindex, follow">
<meta name="description" content="La page que vous cherchez n'existe pas ou a été déplacée. Retrouvez l'agence BRAIN : communication digitale, web, branding et audiovisuel à Abidjan.">
<link rel="icon" type="image/png" href="ASSET/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=2.3">
<style>
  body{background:#071019;color:#f8fafc;min-height:100vh;display:flex;align-items:center;justify-content:center;margin:0;}
  .err-wrap{max-width:720px;padding:48px 24px;text-align:center;}
  .err-code{font-family:'Poppins',sans-serif;font-weight:900;font-size:96px;line-height:1;background:linear-gradient(90deg,#ffab4d,#f68b1f);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .err-title{font-family:'Poppins',sans-serif;font-size:28px;font-weight:700;margin:16px 0 8px;}
  .err-text{color:#aeb6cf;margin:0 0 28px;font-size:16px;}
  .err-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
  .btn{padding:13px 26px;border-radius:10px;background:#f68b1f;color:#fff;text-decoration:none;font-weight:600;font-family:'Inter',sans-serif;transition:.25s;}
  .btn:hover{background:#ffab4d;transform:translateY(-2px);}
  .btn-ghost{background:transparent;border:1px solid #2b3558;color:#e8ecf7;}
  .btn-ghost:hover{background:#0f1b2e;transform:none;}
</style>
</head>
<body>
<div class="err-wrap">
  <div class="err-code">404</div>
  <h1 class="err-title">Cette page s'est perdue dans le cloud</h1>
  <p class="err-text">La page que vous cherchez n'existe plus ou a été déplacée. Bonne nouvelle : notre équipe peut encore vous aider à transformer votre présence digitale.</p>
  <div class="err-actions">
    <a class="btn" href="index.html"><i class="fa-solid fa-house"></i> Retour à l'accueil</a>
    <a class="btn btn-ghost" href="services.html">Nos services</a>
    <a class="btn btn-ghost" href="contact.html">Nous contacter</a>
  </div>
</div>
</body>
</html>
