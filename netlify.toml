# Géolocalisation approximative (pays / région / ville / fuseau) fournie par Netlify
# aux fonctions via les en-têtes x-nf-* . Aucune adresse IP n'est collectée ni stockée.
[geo]
  enabled = true

[[headers]]
  for = "/ASSET/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Le service worker doit toujours être revalidé, sinon les mises à jour sont bloquées
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Envoi différé des notifications push (netlify.toml) — planification annoncée
[functions]
  [functions."push-queue"]
    schedule = "@hourly"